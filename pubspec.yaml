name: hms_mobile
description: "HMS India mobile app — starts with login, talks to the Laravel Sanctum API."
publish_to: 'none'
# <semver>+<build>. The build number becomes Android's versionCode,
# and Play refuses an upload that reuses one -- so it goes up on every
# release, whether or not the semver part moves.
version: 0.2.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.10+1
  provider: ^6.1.2
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
