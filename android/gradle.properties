# Gradle runs on Android Studio's bundled JDK, which is 25 here. From
# JDK 24, a library calling System.load from an unnamed module warns,
# and a future release will refuse it; Gradle's own native-platform
# does exactly that. The flag below grants it for the daemon.
#
# The same warning also comes from the Gradle *launcher*, which starts
# before this file is read, so it keeps printing one copy. To silence
# that one too, set it in the environment instead:
#
#     GRADLE_OPTS=--enable-native-access=ALL-UNNAMED
#
# Either way it is Gradle's own code, not this app's, and a newer
# Gradle will carry the fix.
#
# The heap was 8G with a 4G metaspace, most of a 16G machine before the
# emulator and the IDE ask for theirs. This project builds in 4G.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
